<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Text Lines Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Document Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Icon Background (Rounded Square) -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Document Shape -->
  <path d="M 16 8
           L 40 8
           L 52 20
           L 52 52
           C 52 53.1 51.1 54 50 54
           L 16 54
           C 14.9 54 14 53.1 14 52
           L 14 10
           C 14 8.9 14.9 8 16 8 Z"
        fill="#FFFFFF"
        filter="url(#shadow)"/>

  <!-- Folded Corner -->
  <path d="M 40 8
           L 40 20
           L 52 20 Z"
        fill="#CBD5E1"/>

  <!-- Extracted Text Lines -->
  <rect x="20" y="26" width="24" height="5" rx="2.5" fill="url(#textGrad)"/>
  <rect x="20" y="36" width="18" height="5" rx="2.5" fill="url(#textGrad)"/>
  <rect x="20" y="46" width="26" height="5" rx="2.5" fill="#2DD4BF"/>
</svg>
